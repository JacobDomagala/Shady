name: Code quality check

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

env:
  VULKAN_HEADER_VERSION: 1.4.341

jobs:
  code-quality:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up init script
      shell: bash
      run: |
        cat > init_script.sh <<'EOF'
        #!/bin/bash
        set -eo pipefail
        root_dir="$1"
        build_dir="$2"

        python3 -m venv "$build_dir/venv"
        source "$build_dir/venv/bin/activate"
        pip install conan PyGithub

        conan profile detect
        conan install "$root_dir" --output-folder="$build_dir" --build=missing \
          -s:h build_type=Release -s:h compiler.cppstd=20 \
          -s:b build_type=Release -s:b compiler.cppstd=20 \
          -c tools.system.package_manager:mode=install

        # Match the build workflows' SDK headers without downloading the full SDK.
        curl -fsSL --retry 3 \
          "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v${VULKAN_HEADER_VERSION}.tar.gz" \
          | tar -xz -C "$build_dir"
        curl -fsSL --retry 3 \
          "https://raw.githubusercontent.com/KhronosGroup/Vulkan-Utility-Libraries/v${VULKAN_HEADER_VERSION}/include/vulkan/vk_enum_string_helper.h" \
          -o "$build_dir/Vulkan-Headers-${VULKAN_HEADER_VERSION}/include/vulkan/vk_enum_string_helper.h"
        EOF

    - name: Run static analysis
      uses: JacobDomagala/StaticAnalysis@master
      with:
        exclude_dir: lib build
        init_script: init_script.sh
        apt_pckgs: xorg-dev libgl-dev libvulkan-dev glslc python3-venv curl
        report_pr_changes_only: false
        cmake_args: >-
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake
            -DCMAKE_BUILD_TYPE=Release
            -DVulkan_INCLUDE_DIR="$GITHUB_WORKSPACE/build/Vulkan-Headers-${VULKAN_HEADER_VERSION}/include"
        verbose: false
        clang_tidy_args: "-extra-arg=-DFMT_USE_CONSTEVAL=0"
        cppcheck_args: >-
            --enable=warning,style,performance,portability
            --suppress=functionStatic
            --suppress=functionConst
            --suppress=constParameterPointer
            --suppress=returnByReference
            --suppress=funcArgNamesDifferent
